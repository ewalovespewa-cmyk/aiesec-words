<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AIESEC — ассоциации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Oswald:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --blue:#037EF3; --lb:#5FB8FF; --cream:#F3E3C3; --gold:#E3A35C; --wine:#3a0a10; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:#fff; font-family:Montserrat,system-ui,sans-serif; }
  .hidden { display:none !important; }
  .redbg { background: radial-gradient(ellipse 70% 60% at 42% 38%, #c42a30 0%, #8e1820 38%, #4f0c14 72%, #2a050a 100%); }
  .grain::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.13; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .label { font:700 13px Montserrat,sans-serif; letter-spacing:.28em; color:var(--gold); text-transform:uppercase; }
  .big { font-family:Oswald,sans-serif; font-weight:700; text-transform:uppercase; color:var(--cream); line-height:.98; letter-spacing:.005em; }
  .big .w { color:#fff; }
  .script { font-family:'Great Vibes',cursive; color:var(--gold); }

  /* ---------- participant ---------- */
  #participant { min-height:100%; display:flex; align-items:center; justify-content:center; padding:28px 22px; }
  .card { width:100%; max-width:420px; position:relative; z-index:1; }
  .card .label { margin-bottom:16px; }
  .card .big { font-size:44px; margin-bottom:6px; }
  .card .script { font-size:34px; margin-bottom:22px; }
  .inp { width:100%; background:rgba(0,0,0,.28); border:1.5px solid rgba(243,227,195,.25); color:#fff; border-radius:14px; padding:16px 18px;
         font:600 18px Montserrat,sans-serif; margin-bottom:12px; outline:none; transition:border-color .2s; }
  .inp::placeholder { color:rgba(243,227,195,.5); }
  .inp:focus { border-color:var(--cream); }
  .btn { width:100%; background:var(--cream); color:var(--wine); border:0; border-radius:14px; padding:17px; font:700 20px Oswald,sans-serif;
         letter-spacing:.08em; text-transform:uppercase; margin-top:8px; cursor:pointer; transition:transform .1s, opacity .2s; }
  .btn:active { transform:scale(.98); }
  .btn:disabled { opacity:.5; }
  .err { color:#ffd2c2; font-size:14px; margin-top:12px; min-height:18px; }
  .thanks { text-align:center; }
  .thanks .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:22px; }
  .chip { background:rgba(0,0,0,.25); color:var(--cream); border:1px solid rgba(243,227,195,.3); border-radius:99px; padding:8px 14px; font:600 16px Oswald,sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .small { color:#fff; font-size:15px; font-weight:600; line-height:1.45; }

  /* ---------- admin ---------- */
  #stage { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #collect { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; gap:5vw; padding:6vw 7vw; pointer-events:none; transition:opacity .8s, visibility .8s; }
  #collect .left { max-width:60vw; }
  #collect .label { font-size:1.05vw; margin-bottom:1.6vw; }
  #collect .big { font-size:6.4vw; }
  #collect .script { font-size:3.6vw; margin-top:.6vw; }
  #collect .link { font-size:1.15vw; color:#fff; font-weight:600; margin-top:1.2vw; word-break:break-all; opacity:.9; }
  #countRow { display:flex; align-items:baseline; gap:1.2vw; margin-top:2.6vw; }
  #count { font:700 7.5vw/1 Oswald,sans-serif; color:var(--cream); transition:color 1.2s; }
  #countLbl { font-size:1.05vw; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  #qr { background:var(--cream); padding:1.3vw; border-radius:1.2vw; box-shadow:0 30px 80px rgba(0,0,0,.35); }
  #qr img, #qr canvas { display:block; width:21vw !important; height:21vw !important; position:static; }
  #qrCap { text-align:center; margin-top:1vw; font-size:.95vw; letter-spacing:.28em; color:var(--gold); font-weight:700; text-transform:uppercase; }
  #controls { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:8px; padding:8px;
              background:rgba(20,8,10,.75); border:1px solid rgba(243,227,195,.15); border-radius:16px; backdrop-filter:blur(8px); transition:opacity .4s; z-index:5; }
  #controls.fade { opacity:0; pointer-events:none; }
  #controls button { background:rgba(255,255,255,.07); color:#fff; border:0; border-radius:11px; padding:11px 16px; font:700 14px Montserrat,sans-serif; cursor:pointer; white-space:nowrap; }
  #controls button:hover { background:rgba(255,255,255,.14); }
  #controls button.main { background:var(--cream); color:var(--wine); min-width:110px; font:700 16px Oswald,sans-serif; letter-spacing:.1em; }
  #controls button.warn { color:#ffb0a0; }
  #status { position:absolute; top:18px; left:22px; font-size:13px; color:rgba(243,227,195,.55); font-weight:600; z-index:5; transition:opacity .4s; }
  #hint { position:absolute; top:18px; right:22px; font-size:13px; color:rgba(243,227,195,.55); font-weight:600; z-index:5; transition:opacity .4s; }
  #fadeBlack { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .45s ease-in; z-index:3; }
  #clip { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; opacity:0; visibility:hidden; pointer-events:none; transform:scale(1.04); transition:opacity .6s ease-out, transform .9s cubic-bezier(.2,.7,.2,1), visibility .6s; z-index:4; }
  #clip.on { opacity:1; visibility:visible; transform:scale(1); }
  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; padding:24px; }

</style>
</head>

<!-- ============ PARTICIPANT ============ -->
<div id="participant" class="hidden redbg grain">

/* ===================== PARTICIPANT ===================== */
// единый красный фон (градиент + зерно + пылинки + линии) — одинаковый на всех экранах
function paintBg(W, H, k){
  const c = document.createElement('canvas'); c.width = Math.round(W*k); c.height = Math.round(H*k);
  const g = c.getContext('2d'); g.scale(k, k);
  const R = Math.max(W, H);
  const rg = g.createRadialGradient(W*0.42, H*0.38, 0, W*0.42, H*0.38, R*0.8);
  rg.addColorStop(0, '#c42a30'); rg.addColorStop(0.3, '#8e1820'); rg.addColorStop(0.62, '#4f0c14'); rg.addColorStop(1, '#22040a');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 26; d[i] += n; d[i+1] += n; d[i+2] += n; }
  g.putImageData(im, 0, 0);
  for (let i = 0; i < W*H/9000; i++) { g.fillStyle = `rgba(255,230,210,${Math.random()*0.35})`; g.fillRect(Math.random()*W, Math.random()*H, 1.2, 1.2); }
  g.fillStyle = 'rgba(255,220,200,0.07)'; g.fillRect(W*0.8, 0, 1, H); g.fillRect(W*0.8 + 6, 0, 1, H);
  return c;
}
function applyBg(el){
  let lastW = 0;
  const paint = () => {
    const W = innerWidth, H = Math.max(innerHeight, screen.height || 0);
    if (Math.abs(W - lastW) < 2) return; lastW = W;     // мобильная адресная строка не перерисовывает фон
    el.style.background = `#22040a url(${paintBg(W, H, Math.min(2, devicePixelRatio || 1)).toDataURL('image/jpeg', 0.9)}) center top / ${W}px ${H}px no-repeat fixed`;
    el.classList.remove('grain');
  };
  paint(); addEventListener('resize', paint);
}

function initParticipant(){
  applyBg(document.getElementById('participant'));
  document.getElementById('participant').classList.remove('hidden');
  document.getElementById('pq').innerHTML = CONFIG.QUESTION.replace('AIESEC', '<span class="w">AIESEC</span>');
  const key = 'aiesec-sent-' + ROOM;
  const showThanks = (words) => {
    document.getElementById('formCard').classList.add('hidden');
    document.getElementById('thanksCard').classList.remove('hidden');
    const c = document.getElementById('chips'); c.innerHTML = '';
    words.forEach(w => { const s = document.createElement('span'); s.className='chip'; s.textContent = w; c.appendChild(s); });
  };
  const prev = ls.get(key);
  if (prev) { try { showThanks(JSON.parse(prev)); return; } catch(e){} }

  const form = document.getElementById('form'), err = document.getElementById('err'), btn = document.getElementById('send');
  if (!DB) { err.textContent = 'Платформа ещё не настроена (нет адреса базы).'; btn.disabled = true; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    const words = [...new Set([...form.querySelectorAll('input')].map(i => norm(i.value)).filter(Boolean))];
    if (!words.length) { err.textContent = 'Напиши хотя бы одно слово'; return; }
    btn.disabled = true; btn.textContent = 'Отправляем…';
    try {
      const r = await fetch(DB_PATH + '.json', { method:'POST', body: JSON.stringify({ w: words, t: {'.sv':'timestamp'} }) });
      if (!r.ok) throw new Error(r.status);
      ls.set(key, JSON.stringify(words));
      showThanks(words);
    } catch(e2) {
      err.textContent = 'Не получилось отправить. Проверь интернет и попробуй ещё раз.';
      btn.disabled = false; btn.textContent = 'Отправить';
    }
  });
}

  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const FONT = (s, wgt=800) => `${wgt} ${s}px Montserrat, system-ui, sans-serif`;
  const IF = (s) => `700 ${s}px Oswald, 'Arial Narrow', sans-serif`;
  const BLUE = '#037EF3';

  /* ---------- data ---------- */
  let remote = [];           // массив массивов слов из базы

  function recount(){
    counts = new Map(); responses = remote.length + demo.length;
    for (const arr of [...remote, ...demo]) for (const w of arr) { const n = norm(w); if (n) counts.set(n, (counts.get(n)||0) + 1); }
    document.getElementById('count').textContent = responses;
    document.getElementById('countLbl').textContent = plural(responses, 'ответ', 'ответа', 'ответов');
    const ck = Math.min(1, responses / CONFIG.COUNTER_TARGET);
    document.getElementById('count').style.color = `rgb(${[243,227,195].map((v,i) => Math.round(v + ([95,184,255][i] - v) * ck))})`;
    status();
  }
  function plural(n, a, b, c){ const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?a:(m10>=2&&m10<=4&&(m100<10||m100>=20))?b:c; }
  let dbState = DEMO_EMBED ? 'пробная версия' : DB ? 'подключение…' : 'база не настроена — работает только демо';
  function status(){ document.getElementById('status').textContent = `${responses} ${plural(responses,'ответ','ответа','ответов')} · ${counts.size} слов · ${dbState}`; }

  const seen = new Set();
  async function poll(){
    if (!DB) return;
    try {
      const r = await fetch(DB_PATH + '.json?t=' + Date.now(), { cache:'no-store' });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json() || {};
      const list = [];
      for (const [k, v] of Object.entries(data)) {
        if (!v || !Array.isArray(v.w)) continue;
        list.push(v.w.slice(0,3).map(String));
        if (!seen.has(k)) { seen.add(k); v.w.forEach(w => spawnRecent(norm(w))); }
      }
      remote = list; dbState = 'онлайн'; recount();
    } catch(e) { dbState = 'нет связи с базой'; status(); }
  }
  setInterval(poll, 2000); poll(); recount();

  function spawnRecent(w){
    if (!w || phase !== 'collect') return;
    recent.push({ w, x: 0.05 + Math.random()*0.9, born: performance.now() + Math.random()*2500, s: 18 + Math.random()*22 });
    if (recent.length > 60) recent.shift();
  }

  /* ---------- phases ---------- */
  let phase = 'collect', phaseT = performance.now();
  let island = [], frags = [], human = null;

  function setPhase(p){
    phase = p; phaseT = performance.now();
    document.getElementById('collect').style.opacity = p === 'collect' ? 1 : 0;
    document.getElementById('collect').style.visibility = p === 'collect' ? 'visible' : 'hidden';
    const bm = document.getElementById('bMain');
    bm.textContent = p === 'collect' ? 'READY' : p === 'island' ? 'GO' : p === 'human' ? '▶ ВИДЕО' : '✓';
    bm.disabled = p === 'video';
    document.getElementById('status').style.display = p === 'video' ? 'none' : '';
    document.getElementById('hint').style.display = p === 'video' ? 'none' : '';
    document.getElementById('hint').textContent = p === 'island' ? 'клик по слову — скрыть его' : p === 'human' ? 'нажми на AIESEC IN ASTANA — запустится видео' : '';
  }

  function next(){
    if (phase === 'collect') {
      if (!counts.size) return toast('Пока нет ни одного слова — можно нажать «+ Демо»');
      layoutIsland(); setPhase('island');
    } else if (phase === 'island') {
      if (!island.length) return;
      buildHuman(false); setPhase('human');
    } else if (phase === 'human') playVideo();
  }
  function back(){
    if (phase === 'video') { stopVideo(); return; }
    if (phase === 'human') { setPhase('island'); layoutIsland(); fadeMusic(0); }
    else if (phase === 'island') setPhase('collect');
  }

  /* ---------- island (word cloud) ---------- */
  function layoutIsland(){
    const items = [...counts].filter(([w]) => !blocked.has(w)).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0, CONFIG.MAX_ISLAND_WORDS);
    island = [];
    if (!items.length) return;
    const fmax = items[0][1], fmin = items[items.length-1][1];
    const cx = W/2, cy = H*0.5;
    const bx0 = W*0.04, bx1 = W*0.96, by0 = H*0.08, by1 = H*0.92;
    let scale = 1;
    for (let attempt = 0; attempt < 14; attempt++) {
      const maxS = Math.min(H*0.17, W*0.11) * scale, minS = Math.max(13, maxS*0.24);
      const placed = []; let ok = true;
      items.forEach(([w, f], rank) => {
        if (!ok) return;
        const k = fmax === fmin ? 1 : (f - fmin) / (fmax - fmin);
        const size = minS + (maxS - minS) * Math.sqrt(k);
        ctx.font = IF(size);
        const disp = w.toUpperCase();
        const tw = ctx.measureText(disp).width, th = size * 0.95, pad = size * 0.14;
        let done = false;
        for (let t = 0; t < 400; t += 0.07) {
          const r = t * Math.max(2, size*0.08);
          const x = cx + r * 1.75 * Math.cos(t), y = cy + r * Math.sin(t);
          const rx = x - tw/2, ry = y - th/2;
          if (r * 1.75 > W && r > H) break;
          if (rx < bx0 || rx + tw > bx1 || ry < by0 || ry + th > by1) continue;
          let hit = false;
          for (const p of placed) if (rx < p.x + p.w/2 + pad && rx + tw + pad > p.x - p.w/2 && ry < p.y + p.h/2 + pad && ry + th + pad > p.y - p.h/2) { hit = true; break; }
          if (hit) continue;
          placed.push({ w, f, k, rank, size, x, y, w2: tw, h: th, ph: Math.random()*6.28, color: colorFor(rank, k) });
          placed[placed.length-1].w = tw; placed[placed.length-1].word = disp; placed[placed.length-1].key = w; placed[placed.length-1].a = 1;
          done = true; break;
        }
        if (!done) ok = false;
      });
      if (ok) { island = placed; return; }
      scale *= 0.88;
    }
  }
  function colorFor(rank, k){
    if (rank < 3) return [95,184,255];        // самые частые — голубые
    const m = 0.55 + 0.45 * Math.sqrt(k);      // остальные — кремовые, редкие чуть темнее
    return [243,227,195].map((v, i) => Math.round([196,150,128][i] + (v - [196,150,128][i]) * m));
  }
  function islandPos(it, t){ return { x: it.x, y: it.y + Math.sin(t*0.0011 + it.ph) * Math.max(2, it.size*0.05) }; }

  /* ---------- human ---------- */
  function buildHuman(instant){
    const cap = CONFIG.CAPTION ? 1 : 0;
    const Hs = Math.min(H * (cap ? 0.72 : 0.86), W * 0.9 * MH / MW);
    const sc = Hs / MH, ox = (W - MW*sc)/2, oy = (H - Hs - (cap ? H*0.14 : 0))/2;
    const L = Math.max(7, Hs / 78), fs = L * 1.15;
    ctx.font = IF(fs);
    const cwCache = {}; const cw = ch => cwCache[ch] ?? (cwCache[ch] = ctx.measureText(ch).width);

    // поток слов: сначала все по одному разу, дальше — случайно с весом по частоте
    const totalF = island.reduce((s,it) => s + it.f, 0);
    let order = island.map((_, i) => i), oi = 0;
    function pick(){
      if (oi < order.length) return order[oi++];
      let r = Math.random() * totalF;
      for (let i = 0; i < island.length; i++) { r -= island[i].f; if (r <= 0) return i; }
      return 0;
    }
    let cur; const nextTok = () => { const i = pick(); cur = { wi: i, text: island[i].word + ' ', pos: 0 }; };
    nextTok();

    frags = [];
    for (let y = 0; y + L <= Hs + 0.01; y += L) {
      const rows = [Math.floor(y/sc), Math.floor((y+L/2)/sc), Math.min(MH-1, Math.floor((y+L-0.01)/sc))];
      const col = new Uint8Array(MW);
      for (const r of rows) for (const [a, b] of (MASK[r]||[])) for (let x = a; x < b; x++) col[x]++;
      let a = -1;
      for (let x = 0; x <= MW; x++) {
        const inside = x < MW && col[x] >= 1;
        if (inside && a < 0) a = x;
        if (!inside && a >= 0) { fillRun(ox + a*sc, ox + x*sc, oy + y + L/2); a = -1; }
      }
    }
    function fillRun(x0, x1, yc){
      if (x1 - x0 < fs * 0.4) return;
      let x = x0, guard = 0;
      if (cur.text[cur.pos] === ' ') { cur.pos++; if (cur.pos >= cur.text.length) nextTok(); }
      while (guard++ < 200) {
        const tok = cur.text; let j = cur.pos, w = 0;
        while (j < tok.length && x + w + cw(tok[j]) <= x1) { w += cw(tok[j]); j++; }
        if (j > cur.pos) {
          const t = tok.slice(cur.pos, j);
          if (t.trim()) frags.push({ t: t.replace(/ $/,''), wi: cur.wi, cs: cur.pos, x, y: yc });
          x += w; cur.pos = j;
        }
        if (cur.pos >= tok.length) { nextTok(); continue; }
        break;
      }
    }

    // анимация: откуда летит каждый кусочек
    const now = performance.now();
    let last = 0;
    for (const f of frags) {
      const it = island[f.wi];
      const p = islandPos(it, now);
      const sx = p.x - it.w/2 + (f.cs / it.word.length) * it.w;
      f.sx = sx; f.sy = p.y; f.ss = Math.min(it.size, fs * 2.6); f.ts = fs; f.color = it.color;
      const mx = (sx + f.x)/2, my = (f.sy + f.y)/2, d = Math.hypot(f.x - sx, f.y - f.sy);
      const ang = Math.random()*Math.PI*2;
      f.cx = mx + Math.cos(ang) * d * 0.18; f.cy = my + Math.sin(ang) * d * 0.18;
      const yn = (f.y - oy) / Hs;                       // волна сверху вниз: голова → ноги
      f.delay = 250 + yn * 1700 + Math.random() * 450;
      f.dur = 2300 + Math.random() * 500;
      last = Math.max(last, f.delay + f.dur);
      f.ph = Math.random() * 6.28;
      f.base = it.rank < 3 ? 1 : 0.62 + 0.38 * it.k;
    }
    // таймлайн (мс от нажатия GO)
    const T = { textDone: last, toWhite: last + 500, fill: last + 1000, fillDur: 1900, caption: last + 2600 };
    human = { Hs, ox, oy, fs, sc, T, instant };
  }

  function frame(now){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    ctx.textBaseline = 'middle';
    const pt = now - phaseT;
    // красный фон с зерном на первых двух экранах, на GO плавно уходит в чёрный
    const redA = 1;
    if (redA > 0 && BG) { ctx.globalAlpha = redA; ctx.drawImage(BG, 0, 0, W, H); ctx.globalAlpha = 1; }

    if (phase === 'collect') {
      ctx.textAlign = 'center';
      recent = recent.filter(r => now - r.born < 9000);
      for (const r of recent) {
        if (now < r.born) continue;
        const age = (now - r.born)/9000;
        ctx.font = IF(r.s);
        ctx.fillStyle = `rgba(243,227,195,${Math.sin(age*Math.PI)*0.22})`;
        ctx.fillText(r.w.toUpperCase(), r.x*W, H*(1.05 - age*1.1));
      }
    }

    // остров: появляется в фазе island и плавно растворяется после GO
    const islFade = phase === 'island' ? 1 : (phase === 'human' && human && !human.instant) ? 1 - smooth(pt / 1100) : 0;
    if (islFade > 0) {
      ctx.textAlign = 'center';
      for (const it of island) {
        let lt = phase === 'island' ? clamp01((pt - it.rank*45)/700) : 1;
        if (lt <= 0) continue;
        const p = islandPos(it, now);
        const s = phase === 'island' ? outBack(lt) : 1 - 0.12 * (1 - islFade);
        ctx.font = IF(it.size * s);
        ctx.fillStyle = `rgba(${it.color},${lt * islFade * it.a})`;
        ctx.fillText(it.word, p.x, p.y);
      }
    }

    if ((phase === 'human' || phase === 'video') && human) {
      const T = human.T, tt = human.instant ? 1e9 : pt;
      const toWhite = smooth((tt - T.toWhite) / 900);           // слова белеют
      const fill = smooth((tt - T.fill) / T.fillDur);            // заливка силуэта белым
      // мягкое свечение за фигурой
      const ga = smooth((tt - T.textDone + 1500) / 1500) * (0.14 - 0.06 * fill);
      if (ga > 0) {
        const g = ctx.createRadialGradient(W/2, human.oy + human.Hs*0.45, 0, W/2, human.oy + human.Hs*0.45, human.Hs*0.6);
        g.addColorStop(0, `rgba(255,170,150,${ga})`); g.addColorStop(1, 'rgba(255,170,150,0)');
        ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      }
      const textAlpha = 1 - smooth((tt - T.fill - 400) / 1300);
      if (textAlpha > 0) {
        ctx.textAlign = 'left';
        let lastFont = '';
        for (const f of frags) {
          const t = clamp01((tt - f.delay) / f.dur);
          if (t <= 0) continue;
          const e = ease(t), u = 1 - e;
          const x = u*u*f.sx + 2*u*e*f.cx + e*e*f.x;
          const y = u*u*f.sy + 2*u*e*f.cy + e*e*f.y;
          const s = f.ss + (f.ts - f.ss) * e;
          const appear = smooth(t / 0.3);
          const a = (f.base + (1 - f.base) * toWhite) * appear * textAlpha;
          const c = f.color.map(v => Math.round(v + (255 - v) * toWhite));
          const fnt = IF(Math.round(s*2)/2);
          if (fnt !== lastFont) { ctx.font = fnt; lastFont = fnt; }
          ctx.fillStyle = `rgba(${c},${a})`;
          ctx.fillText(f.t, x, y);
        }
      }
      if (fill > 0 && SIL.complete) {
        ctx.globalAlpha = fill;
        ctx.drawImage(SIL, human.ox, human.oy, MW * human.sc, MH * human.sc);
        ctx.globalAlpha = 1;
      }
      if (CONFIG.CAPTION) {
        const ca = smooth((tt - T.caption) / 1400);
        capRect = null;
        if (ca > 0) {
          // подпись-кнопка: по нажатию запускается видео
          const fsz = Math.max(16, H*0.034), cy = human.oy + human.Hs + H*0.06 + (1 - ca) * 12;
          ctx.textAlign = 'center';
          ctx.font = FONT(fsz);
          try { ctx.letterSpacing = '0.14em'; } catch(e){}
          const tw = ctx.measureText(CONFIG.CAPTION).width;
          const bw = tw + fsz*2.2, bh = fsz*2.3, bx = W/2 - bw/2, by = cy - bh/2;
          const pulse = 0.5 + 0.5*Math.sin(now*0.003);
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, bh/2) : ctx.rect(bx, by, bw, bh);
          ctx.fillStyle = `rgba(255,255,255,${ca * (capHover ? 0.2 : 0.06 + 0.05*pulse)})`; ctx.fill();
          ctx.lineWidth = 1.5; ctx.strokeStyle = `rgba(255,255,255,${ca * (capHover ? 0.95 : 0.45 + 0.25*pulse)})`; ctx.stroke();
          ctx.fillStyle = `rgba(255,255,255,${ca})`;
          ctx.fillText(CONFIG.CAPTION, W/2 + fsz*0.07, cy + 1);
          try { ctx.letterSpacing = '0px'; } catch(e){}
          if (ca > 0.6 && phase === 'human') capRect = { x: bx, y: by, w: bw, h: bh };
        }
      }
    }
    requestAnimationFrame(frame);
  }

  let BG = null;
  function makeBg(){ BG = paintBg(W, H, 1); }
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    makeBg();
    if (phase === 'island') layoutIsland();
    if (phase === 'human' || phase === 'video') { layoutIsland(); buildHuman(true); }
  }
  addEventListener('resize', resize);

  /* ---------- video ---------- */
  let capRect = null, capHover = false;
  const inCap = (e) => capRect && e.clientX >= capRect.x && e.clientX <= capRect.x + capRect.w && e.clientY >= capRect.y && e.clientY <= capRect.y + capRect.h;
  cv.addEventListener('mousemove', (e) => { capHover = inCap(e); cv.style.cursor = capHover ? 'pointer' : ''; });
  cv.addEventListener('click', (e) => { if (phase === 'human' && inCap(e)) playVideo(); });
  const clip = document.getElementById('clip'), fadeBlack = document.getElementById('fadeBlack');
  if (CONFIG.VIDEO_SRC) { clip.src = CONFIG.VIDEO_SRC; clip.load(); }
  // когда видео закончилось — плавно уходим в чёрный экран
  clip.addEventListener('ended', () => { if (phase === 'video') clip.classList.remove('on'); });
  let volTimer = null;
  function playVideo(){
    if (!human) return;
    if (!clip.src) return toast('Видео не найдено — положи video.mp4 рядом с index.html');
    human.instant = true; capHover = false; cv.style.cursor = '';
    setPhase('video');
    clip.currentTime = 0; clip.volume = 0;
    clip.play().catch(() => toast('Браузер не дал включить видео — нажми ещё раз'));
    clearInterval(volTimer); const t0 = performance.now();
    volTimer = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / 1500); clip.volume = k; if (k >= 1) clearInterval(volTimer); }, 30);
    // быстрый плавный переход: сцена уходит в чёрный, видео раскрывается на весь экран
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); } catch(e){}
    document.getElementById('controls').classList.add('fade');
    fadeBlack.style.opacity = 1;
    const reveal = () => { if (phase === 'video') clip.classList.add('on'); };
    if (clip.readyState >= 3) setTimeout(reveal, 300);
    else clip.addEventListener('playing', () => setTimeout(reveal, 150), { once: true });   // если видео ещё грузится — ждём на чёрном
  }
  function stopVideo(){
    clearInterval(volTimer); clip.pause(); clip.classList.remove('on'); fadeBlack.style.opacity = 0;
    setPhase('human');
  }

  /* ---------- island click: hide word ---------- */
  cv.addEventListener('click', (e) => {
    if (phase !== 'island') return;
    const now = performance.now();
    for (const it of island) {
      const p = islandPos(it, now);
      if (Math.abs(e.clientX - p.x) < it.w/2 && Math.abs(e.clientY - p.y) < it.h/2) {
        blocked.add(it.key); ls.set('aiesec-blocked-'+ROOM, JSON.stringify([...blocked]));
        toast(`«${it.word}» скрыто`);
        layoutIsland(); phaseT = now - 5000; return;
      }
    }
  });

  /* ---------- music ---------- */
  const music = document.getElementById('music');
  if (CONFIG.MUSIC_SRC) music.src = CONFIG.MUSIC_SRC;
  let fadeTimer = null;
  function fadeMusic(target, ms = 1800){
    clearInterval(fadeTimer);
    const start = music.volume, t0 = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0)/ms);
      music.volume = start + (target - start)*k;
      if (k >= 1) { clearInterval(fadeTimer); if (target === 0) music.pause(); }
    }, 30);
  }
  function startMusic(){
    if (!music.src) return;
    music.volume = 0; music.currentTime = 0;
    music.play().then(() => fadeMusic(1)).catch(() => toast('Браузер не дал включить звук — нажми M'));
  }
  document.getElementById('bMusic').onclick = () => document.getElementById('musicFile').click();
  document.getElementById('musicFile').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    music.src = URL.createObjectURL(f);
    document.getElementById('bMusic').textContent = '♪ ' + (f.name.length > 16 ? f.name.slice(0,14)+'…' : f.name);

  };

  /* ---------- controls ---------- */

  document.getElementById('bFull').onclick = full;

    const top = ['лидерство','команда','друзья','семья','рост'];
    for (let i = 0; i < 20; i++) {
      const arr = new Set([top[Math.floor(Math.random()*top.length)]]);
      while (arr.size < 1 + Math.floor(Math.random()*3)) arr.add(pool[Math.floor(Math.random()*pool.length)]);
      demo.push([...arr]); [...arr].forEach(spawnRecent);
    }
    recount(); toast('+20 тестовых ответов (только на этом экране)');
  };
  let resetArm = 0;
  document.getElementById('bReset').onclick = async () => {
    if (Date.now() - resetArm > 3000) { resetArm = Date.now(); return toast('Нажми ещё раз, чтобы удалить ВСЕ ответы'); }
    resetArm = 0; demo = []; blocked.clear(); ls.set('aiesec-blocked-'+ROOM, '[]');
    if (DB) { try { await fetch(DB_PATH + '.json', { method:'DELETE' }); } catch(e){} }
    remote = []; seen.clear(); recount(); clip.pause(); clip.classList.remove('on'); fadeBlack.style.opacity = 0; setPhase('collect'); toast('Все ответы удалены');
  };
  function full(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }
  addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
    else if (e.key === 'Backspace' || e.key === 'ArrowLeft' || e.key === 'Escape' || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); back(); }

    ['controls','status','hint'].forEach(id => document.getElementById(id).classList.remove('fade'));
    document.getElementById('status').style.opacity = 1; document.getElementById('hint').style.opacity = 1;
    document.body.style.cursor = '';
    clearTimeout(idle);
    idle = setTimeout(() => {
      document.getElementById('controls').classList.add('fade');
      document.getElementById('status').style.opacity = 0; document.getElementById('hint').style.opacity = 0;
      document.body.style.cursor = 'none';
    }, 2500);
  };
  addEventListener('mousemove', wake); wake();

  let toastT;
  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2400); }

  setPhase('collect');
  (document.fonts ? Promise.all([document.fonts.load('800 40px Montserrat'), document.fonts.load('700 40px Oswald')]) : Promise.resolve()).catch(()=>{}).then(() => { resize(); requestAnimationFrame(frame); });
}

function adminGate(){
  // экран с кнопками открывается только по коду — участники видят только форму
  if (DEMO_EMBED || !CONFIG.ADMIN_PIN) return initAdmin();
  let ok = false; try { ok = sessionStorage.getItem('aiesec-admin') === CONFIG.ADMIN_PIN; } catch(e){}
  if (ok) return initAdmin();
  const g = document.createElement('div'); g.id = 'gate'; g.className = 'redbg grain'; applyBg(g);
  g.innerHTML = `<div class="card"><div class="label" style="margin-bottom:14px">AIESEC in Astana</div>
    <div class="big">Экран админа</div><div class="script" style="font-size:30px;margin-bottom:20px">введи код</div>
    <form id="gform" autocomplete="off"><input class="inp" id="gpin" type="password" inputmode="numeric" placeholder="Код">
    <button class="btn" type="submit">Войти</button><div class="err" id="gerr"></div></form></div>`;
  document.body.appendChild(g);
  document.getElementById('gpin').focus();
  document.getElementById('gform').addEventListener('submit', (e) => {
    e.preventDefault();
    if (document.getElementById('gpin').value.trim() === CONFIG.ADMIN_PIN) {
      try { sessionStorage.setItem('aiesec-admin', CONFIG.ADMIN_PIN); } catch(e2){}
      g.remove(); initAdmin();
    } else document.getElementById('gerr').textContent = 'Неверный код';
  });
}
if (IS_ADMIN) adminGate(); else initParticipant();
addEventListener('hashchange', () => location.reload());
</script>
